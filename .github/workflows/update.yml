name: update-samo-flow

on:
  schedule:
    - cron: "30 9 * * 1-5"
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samo-flow
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -U -r requirements.txt
      - name: Fetch KRX data
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: python scripts/fetch_samo.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: samo flow $(date +%Y-%m-%d)"
          git push
